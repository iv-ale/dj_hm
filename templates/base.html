<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Статьи{% endblock %}</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 16px;
            line-height: 1.6;
            color: #1f2933;
            background: #f7f9fb;
        }
        nav { margin-bottom: 24px; }
        nav a {
            margin-right: 16px;
            color: #0b5fff;
            text-decoration: none;
            font-weight: 600;
        }
        nav a:hover { text-decoration: underline; }
        h1 { margin-bottom: 8px; }
        h2 { margin: 0 0 4px; font-size: 20px; }
        h2 a { color: #1f2933; text-decoration: none; }
        h2 a:hover { color: #0b5fff; }
        ul.list { list-style: none; padding: 0; }
        ul.list li {
            background: #fff;
            border: 1px solid #e4e7eb;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }
        .muted { color: #7b8794; font-size: 14px; margin: 0 0 6px; }
        .muted a { color: #0b5fff; text-decoration: none; }
        form.search { display: flex; gap: 8px; margin: 16px 0; }
        form.search input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #cbd2d9;
            border-radius: 8px;
            font-size: 15px;
        }
        form.search button {
            padding: 10px 20px;
            border: 0;
            border-radius: 8px;
            background: #0b5fff;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        form.search button:hover { background: #0949cc; }
        .cats { margin-bottom: 16px; }
        .cats a {
            display: inline-block;
            margin: 0 8px 8px 0;
            padding: 4px 12px;
            border: 1px solid #cbd2d9;
            border-radius: 999px;
            color: #52606d;
            text-decoration: none;
            font-size: 14px;
        }
        .cats a:hover { border-color: #0b5fff; color: #0b5fff; }
        .cats a.active { background: #0b5fff; border-color: #0b5fff; color: #fff; }
        .pagination {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-top: 20px;
            font-size: 15px;
        }
        .pagination a { color: #0b5fff; text-decoration: none; font-weight: 600; }
        .article-body { background: #fff; border: 1px solid #e4e7eb;
                        border-radius: 12px; padding: 20px 24px; }
        a.back { color: #0b5fff; text-decoration: none; font-weight: 600; }
        a.back:hover { text-decoration: underline; }
        footer { margin-top: 32px; color: #7b8794; font-size: 14px; }
    </style>
</head>
<body>
    <nav>
        {# Все ссылки — только через {% url %}, без зашитых адресов #}
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'article_list' %}">Статьи</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>Учебный проект по Django · урок 49</footer>
</body>
</html>
