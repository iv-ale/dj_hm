<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Страница не найдена (404)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f7f9fb;
            color: #1f2933;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            box-shadow: 0 10px 30px rgba(31, 41, 51, .08);
            max-width: 480px;
        }
        .code {
            font-size: 88px;
            font-weight: 700;
            line-height: 1;
            color: #0b5fff;
        }
        h1 { margin: 16px 0 8px; font-size: 24px; }
        p { color: #52606d; margin: 0 0 24px; }
        a.button {
            display: inline-block;
            background: #0b5fff;
            color: #fff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
        }
        a.button:hover { background: #0949cc; }
    </style>
</head>
<body>
    <main class="card">
        <div class="code">404</div>
        <h1>Такой страницы нет</h1>
        <p>Возможно, адрес введён с ошибкой или страница была удалена.</p>
        <a class="button" href="/">На главную</a>
    </main>
</body>
</html>
