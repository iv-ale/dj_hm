{% extends "base.html" %}

{% block title %}Страница не найдена (404){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div
        class="display-1 fw-bold text-primary"
        style="line-height: 1;"
    >404</div>
    <h1 class="h3 mt-3">Такой страницы нет</h1>
    <p class="text-muted mb-4">
        Возможно, адрес введён с ошибкой или страница была удалена.
    </p>
    <a href="{% url 'article_list' %}" class="btn btn-primary">
        Ко всем статьям
    </a>
    <a href="{% url 'home' %}" class="btn btn-outline-secondary">
        На главную
    </a>
</div>
{% endblock %}
